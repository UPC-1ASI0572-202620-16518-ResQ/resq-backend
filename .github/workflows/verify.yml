name: Verify .NET backend
on:
  push:
    branches: [main, feature/thingspeak-integration]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ResQ-Backend.sln
      - name: Build
        run: dotnet build ResQ-Backend.sln --no-restore -c Release
